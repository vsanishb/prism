# Model routes (D-026, D-057, D-070). The user chose DeepSeek V4.1 Flash for every task, on cost.
# Every route must be zero-data-retention, and the gateway checks this before each use.
# Escalation runs only when output stays invalid after a repair.

[tasks.classification]
primary = "deepseek/deepseek-v4.1-flash-1017"
escalation = "anthropic/claude-haiku-5.5"
claim_data = true
max_tokens = 300

[tasks.extraction]
primary = "deepseek/deepseek-v4.1-flash-1017"
escalation = "anthropic/claude-haiku-5.5"
claim_data = true
max_tokens = 8000

[tasks.reread]
primary = "deepseek/deepseek-v4.1-flash-1017"
escalation = "anthropic/claude-haiku-5.5"
claim_data = true
max_tokens = 1500

# Every critical policy value is confirmed by a person before publication (D-030).
[tasks.policy_extraction]
primary = "deepseek/deepseek-v4.1-flash-1017"
escalation = "anthropic/claude-haiku-5.5"
claim_data = true
max_tokens = 16000

# Policy Agent (M6, D-079). Claim facts are sent, de-identified. Findings are validated by code.
[tasks.agent_plan]
primary = "deepseek/deepseek-v4.1-flash-1017"
escalation = "anthropic/claude-haiku-5.5"
claim_data = true
max_tokens = 1500

[tasks.agent_analysis]
primary = "deepseek/deepseek-v4.1-flash-1017"
escalation = "anthropic/claude-haiku-5.5"
claim_data = true
max_tokens = 3000

# Risk summary (M7, D-086). De-identified signals only. The configured model on both attempts: the
# summary is optional, and no other model is introduced for it.
[tasks.risk_summary]
primary = "deepseek/deepseek-v4.1-flash-1017"
escalation = "deepseek/deepseek-v4.1-flash-1017"
claim_data = true
max_tokens = 800

# Search (M5, D-075). Queries will carry claim facts in M6, so these are held to the same rules.
# The index records its embedding model, and a query is embedded with that model, not this one.
[embedding]
model = "openai/text-embedding-3-small"
dimensions = 1536
claim_data = true
batch_size = 64

[rerank]
model = "qwen/qwen3-reranker-8b"
claim_data = true
