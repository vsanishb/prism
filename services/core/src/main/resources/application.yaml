spring:
  application:
    name: prism-core
  config:
    # Local development reads the repository .env. Deployed environments use real variables.
    import: optional:file:../../.env[.properties]
  datasource:
    url: ${PRISM_CORE_DB_URL}
    username: ${PRISM_CORE_DB_USER}
    password: ${PRISM_CORE_DB_PASSWORD}
    hikari:
      # Kept small for a single local server. The timeout tolerates a slow start after a restart.
      maximum-pool-size: 10
      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    timeout: 30m
    jdbc:
      table-name: core.spring_session
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Above the largest allowed document, so that per-type limits give the clear error.
      max-file-size: 60MB
      max-request-size: 61MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ${PRISM_LOG_FORMAT:ecs}

prism:
  environment: ${PRISM_ENVIRONMENT:deployed}
  web-base-url: ${PRISM_WEB_BASE_URL}
  default-currency: INR
  security:
    throttle-hmac-key: ${PRISM_THROTTLE_HMAC_KEY}
    cookie-secure: ${PRISM_COOKIE_SECURE:true}
    forwarded-header-trusted: ${PRISM_FORWARDED_HEADER_TRUSTED:false}
    absolute-session-timeout: 12h
    invitation-validity: 72h
    password-reset-validity: 1h
  service-auth:
    private-key-path: ${PRISM_SERVICE_JWT_PRIVATE_KEY_PATH}
    key-id: core-1
    token-ttl: 60s
  documents:
    storage-path: ${PRISM_DOCUMENT_STORE_PATH}
    max-claim-document-bytes: 26214400
    max-policy-document-bytes: 52428800
    max-claim-document-pages: 200
    max-policy-document-pages: 1000
    max-image-pixels: 60000000
    max-rendered-edge-pixels: 1800
  ai:
    base-url: ${PRISM_AI_BASE_URL}
    timeout: 5s
    # Below the activity's five-minute limit, so that a slow call fails here, with a clear reason.
    extraction-timeout: 4m
    # Covers an embedding and a rerank, each with one retry, so that a search fails rather than hangs.
    search-timeout: 30s
    # Below the analysis activity's ten-minute limit. An analysis is many model calls in sequence.
    analysis-timeout: 9m
  temporal:
    enabled: ${PRISM_TEMPORAL_ENABLED:true}
    target: ${PRISM_TEMPORAL_TARGET:127.0.0.1:7233}
    namespace: default
    # How long a claim waits for missing documents before going to review without them.
    information-wait: ${PRISM_INFORMATION_WAIT:14d}
    max-concurrent-extractions: 4
    relay-interval: 1s
  bootstrap:
    admin-email: ${PRISM_BOOTSTRAP_ADMIN_EMAIL:}
    invite-file: ${PRISM_BOOTSTRAP_INVITE_FILE:}
  seed:
    credentials-file: ${PRISM_SEED_CREDENTIALS_FILE:}
    documents-path: ${PRISM_SEED_DOCUMENTS_PATH:../../test-data}
