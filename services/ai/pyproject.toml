[project]
name = "prism-ai"
version = "0.1.0"
description = "Prism AI and processing service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "psycopg[binary,pool]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
